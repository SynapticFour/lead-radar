name: Lead Radar
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Ignore dedup ledger and re-evaluate recently-seen items'
        type: boolean
        default: false
      reset_days:
        description: 'How many days back to un-mark as seen (0 = clear entire ledger, re-evaluate everything ever seen)'
        type: string
        default: '1'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Lead Radar
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            ARGS="--reset-days ${{ github.event.inputs.reset_days || '1' }}"
          fi
          # Cloud LLM triage (Gemini → Groq → Cerebras), same role as local
          # `make triage-digest` / SIE keys — no Ollama. Keyword .jsonl still
          # saved pre-triage for optional local re-runs.
          if [ -n "${GEMINI_API_KEY:-}${GROQ_API_KEY:-}${CEREBRAS_API_KEY:-}${ANTHROPIC_API_KEY:-}" ]; then
            ARGS="$ARGS --triage cloud"
            echo "[ci] LLM triage enabled (cloud: gemini/groq/cerebras)"
          else
            echo "[ci] no cloud LLM keys — keyword digest only"
          fi
          python main.py $ARGS
        env:
          # Optional PAT (code search); github.py falls back to GITHUB_TOKEN.
          LEAD_RADAR_GITHUB_TOKEN: ${{ secrets.LEAD_RADAR_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: contact@synapticfour.com
      - name: Commit digest
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "bot@localhost"
          git add digests/ data/seen.db MANUAL_CHECKLIST.md
          git add -f raw/ 2>/dev/null || true
          git commit -m "Digest $(date +%F)$( [ '${{ github.event.inputs.reset }}' = 'true' ] && echo ' (reset run)' )" || echo "nothing to commit"
          git push
